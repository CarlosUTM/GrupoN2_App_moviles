<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario - Dashboard</title>
    <link rel="stylesheet" href="../css/style.css"> 
</head>
<body>

    <h1>Inventario de Productos</h1>
    
    <div style="max-width: 600px; margin: 0 auto;">
        <form id="searchForm" style="display: flex; gap: 10px; margin-bottom: 30px;">
            <input type="text" id="searchInput" placeholder="🔍 Buscar por nombre..." style="margin-bottom: 0;">
            <button type="submit" style="width: auto; margin-top: 0; white-space: nowrap;">Buscar</button>
        </form>
    </div>

    <a href="crear.html" class="btn-add">+ Nuevo Producto</a>

    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Cantidad</th>
                    <th>Ubicación</th>
                    <th style="text-align: center;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaProductos">
                </tbody>
        </table>
    </div>
    <script src="../js/app.js"></script>
</body>
</html>
