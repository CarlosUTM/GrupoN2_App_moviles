<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Producto</title>
    <link rel="stylesheet" href="../css/style.css"> </head>
<body>

    <div class="container">
        <h1>Agregar Producto</h1>

        <form id="crearForm">
            <div class="form-group">
                <label for="nombre">Nombre del producto</label>
                <input type="text" id="nombre" placeholder="Ej: Microscopio Digital" required>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción</label>
                <input type="text" id="descripcion" placeholder="Breve descripción">
            </div>

            <div class="form-group">
                <label for="cantidad">Cantidad</label>
                <input type="number" id="cantidad" placeholder="0" required>
            </div>

            <div class="form-group">
                <label for="ubicacion">Ubicación</label>
                <input type="text" id="ubicacion" placeholder="Ej: Estante A">
            </div>

            <div class="form-group">
                <label for="categoria">Categoría</label>
                <input type="text" id="categoria" placeholder="Ej: Laboratorio">
            </div>

            <button type="submit">Guardar Producto</button>
        </form>

        <a href="../index.html" class="btn-back">← Volver al listado</a>
    </div>

    <script src="../js/app.js"></script>
</body>
</html>
